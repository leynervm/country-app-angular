<section class="flex flex-col gap-2 mt-2">
    <div class="bg-base-100 shadow-sm">
        <app-country-search-input placeholder="Buscar por país" 
            (search)="search.set($event)" [initialValue]="search()" [debounceTime]="500" />

        <app-country-list [countries]="countryResource.value() ?? []" [errorMessage]="countryResource.error()"
            [isLoading]="countryResource.isLoading()" [isEmpty]="countryResource.value()?.length ===0" />
    </div>
</section>
