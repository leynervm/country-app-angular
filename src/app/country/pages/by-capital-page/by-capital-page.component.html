<section class="flex flex-col gap-2 mt-2">
    <div class="bg-base-100 shadow-sm">
        <app-country-search-input placeholder="Buscar por capital" (search)="query.set($event)" [initialValue]="query()"
            [debounceTime]="500" />

        <app-country-list [countries]="countryResource.value()?? []" [isLoading]="countryResource.isLoading()"
            [errorMessage]="countryResource.error()" [isEmpty]="countryResource.value()?.length ===0" />
    </div>
</section>
