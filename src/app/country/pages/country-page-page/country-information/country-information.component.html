<!-- <h1 class="text-blue-500 text-2xl">PAIS : {{ country() | json}}</h1> -->

<section class="mx-10">
    <div class="place-content-center grid shadow stats">
        <div class="stat">
            <div class="text-primary stat-figure">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    class="inline-block stroke-current w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                    </path>
                </svg>
            </div>
            <div class="stat-title">{{ country().capital }} - {{ country().flag }}</div>
            <div class="text-primary stat-value">{{ country().name }}</div>
            <div class="stat-desc">{{ country().region }} - {{ country().subregion }}</div>
        </div>

        <div class="stat">
            <div class="text-secondary stat-figure">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    class="inline-block stroke-current w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div class="stat-title">Población</div>
            <div class="text-secondary stat-value">{{ country().population | number }}</div>
            <div class="stat-desc">desde {{ currentyear() }}</div>
        </div>

        <div class="stat">
            <div class="text-secondary stat-figure">
                <div class="avatar online">
                    <div class="rounded-full w-16">
                        <img [src]="country().flagSvg" />
                    </div>
                </div>
            </div>
            <!-- <div class="stat-value">86%</div>
            <div class="stat-title">Tasks done</div> -->
            <div class="text-secondary stat-desc">Bandera</div>
        </div>
    </div>
</section>

<section class="mx-10">
    <figure class="aspect-16/9 diff" tabindex="0">
        <div class="diff-item-2" role="img" tabindex="0">
            <img [alt]="country().name" [src]="country().flagSvg" />
        </div>
        <div class="diff-item-1" role="img">
            <img class="brightness-75 blur" [alt]="country().name" [src]="country().flagSvg" />
        </div>
        <div class="diff-resizer"></div>
    </figure>
</section>
