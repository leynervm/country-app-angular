<div class="flex gap-2">
    <input type="text" [placeholder]="placeholder()" class="block input-bordered focus:outline-0 input"
        (keyup.enter)="search.emit(txtCountrySearch.value)" (keyup)="inputValue.set(txtCountrySearch.value)"
        #txtCountrySearch [placeholder]="(placeholder())" [value]="inputValue()" />
    <button class="btn btn-info" (click)="search.emit(txtCountrySearch.value)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
            class="block size-5">
            <circle cx="11" cy="11" r="6" />
            <path stroke-linecap="round" d="m20 20l-3-3" />
        </svg>
    </button>
</div>
